# PostgreSQL with a replicated volume. Other apps connect to
# postgres://postgres:<password>@postgres.internal:5432/postgres
#
# First deploy:
#   latrix deploy --detach
#   latrix secrets set postgres POSTGRES_PASSWORD=change-me
#
# For consistent backups, pass --stop:
#   latrix backup postgres --stop
app = "postgres"

[build]
image = "postgres:16"

[env]
# Keep PGDATA in a subdirectory of the mounted volume so initdb works cleanly
# even if the volume root contains filesystem metadata (e.g. lost+found).
PGDATA = "/var/lib/postgresql/data/pgdata"

# latrix's own machines discover EXPOSEd ports automatically; declaring it
# also makes it reachable on Kubernetes targets.
[[ports]]
port = 5432

[scale]
cpu = 1
memory = "1GB"

[[volumes]]
name = "data"
path = "/var/lib/postgresql/data"
copies = 2
sync = "15s"

[deploy]
stop_timeout = "30s"   # let postgres shut down cleanly before a move
