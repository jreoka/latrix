[package]
name = "latrix"
version = "0.1.6"
edition = "2021"
description = "A tiny self-managing cluster: deploy apps across your servers as if they were one machine."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
x509-parser = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
tar = "0.4"
flate2 = "1"
ignore = "0.4"
dirs = "5"
serde_yaml = "0.9"
base64 = "0.22"
libc = "0.2"
terminal_size = "0.4"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
