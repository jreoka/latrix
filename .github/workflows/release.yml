# Publishes binaries as a GitHub release, automatically: every push whose
# Cargo.toml version has no release yet builds and publishes v<version>.
# Also runnable by hand (Actions → release → Run workflow) or by pushing a
# tag like v0.1.0. `latrix machine add` run from macOS/Windows downloads
# latrix-<arch>-unknown-linux-musl from the release matching its version.
name: release
on:
  push:
    branches: [main, claude/nice-albattani-9vihgt]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0 (default: Cargo.toml version)"
        required: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            v="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$v is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "will release $v"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }
          - { os: macos-latest, target: x86_64-apple-darwin, cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, cross: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.cross
        run: cargo install cross --locked
      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/latrix.exe dist/latrix-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/latrix dist/latrix-${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: latrix-${{ matrix.target }}
          path: dist/*

  publish:
    needs: [check, build]
    # Publish whatever built, even if one platform failed.
    if: ${{ !cancelled() && needs.check.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: generate checksums
        run: |
          cd dist
          sha256sum latrix-* > SHA256SUMS
          cat SHA256SUMS
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: latrix ${{ needs.check.outputs.version }}
          files: dist/*
          generate_release_notes: true
